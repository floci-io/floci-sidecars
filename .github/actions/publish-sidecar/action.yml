name: Publish a sidecar image
description: Build one sidecar for linux/amd64 and linux/arm64 and push it to Docker Hub

inputs:
  sidecar:
    description: Sidecar directory
    required: true
  version:
    description: Image tag and SIDECAR_VERSION
    required: true
  latest:
    description: Also move the latest tag
    required: true
  dockerhub-username:
    required: true
  dockerhub-token:
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Compute tags
      id: tags
      shell: bash
      run: |
        image="floci-sidecar-${{ inputs.sidecar }}"
        tags="floci/$image:${{ inputs.version }}"
        if [ "${{ inputs.latest }}" = "true" ]; then
          tags="$tags"$'\n'"floci/$image:latest"
        fi
        {
          echo "tags<<EOF"
          echo "$tags"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ inputs.sidecar }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: mode=max
        sbom: true
        build-args: SIDECAR_VERSION=${{ inputs.version }}
        tags: ${{ steps.tags.outputs.tags }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.sidecar }}
        cache-to: type=gha,scope=${{ inputs.sidecar }},mode=max
