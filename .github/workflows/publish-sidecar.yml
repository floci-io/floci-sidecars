name: Publish sidecar

# Called by release.yml. Builds one sidecar's native executable on a runner of each
# architecture, then packages both into one multi-arch image and pushes it to Docker Hub.
on:
  workflow_call:
    inputs:
      sidecar:
        description: Sidecar directory
        required: true
        type: string
      version:
        description: Image tag and SIDECAR_VERSION
        required: true
        type: string
      latest:
        description: Also move the latest tag
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-native:
    name: Build ${{ inputs.sidecar }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            march: -Dquarkus.native.additional-build-args-append=-march=x86-64-v2
          - arch: arm64
            runner: ubuntu-24.04-arm
            march: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven

      - name: Build the native executable and run the integration tests against it
        run: ./mvnw -B -pl ${{ inputs.sidecar }} -am verify -Dnative ${{ matrix.march }}

      - name: Stage the executable and its native library
        run: |
          mkdir -p native/${{ matrix.arch }}
          cp ${{ inputs.sidecar }}/target/sidecar-runner native/${{ matrix.arch }}/application
          find ${{ inputs.sidecar }}/target -path '*-native/*' -name '*.so' -exec cp {} native/${{ matrix.arch }}/ \; 2>/dev/null || true
          ls -la native/${{ matrix.arch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ inputs.sidecar }}-${{ matrix.arch }}
          path: native/${{ matrix.arch }}/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.sidecar }} ${{ inputs.version }}
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ inputs.sidecar }}-amd64
          path: native/amd64/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ inputs.sidecar }}-arm64
          path: native/arm64/

      - name: Restore executable bits
        run: chmod 755 native/*/application && ls -laR native

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          image="floci-sidecar-${{ inputs.sidecar }}"
          tags="floci/$image:${{ inputs.version }}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            tags="$tags"$'\n'"floci/$image:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.sidecar }}/Dockerfile.package
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: SIDECAR_VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
