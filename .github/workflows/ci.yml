name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify every module (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  # Every sidecar ships as a native executable. Both published architectures build on PRs:
  # the JNI and reflection configuration is only proven by running the *IT classes against
  # the binary, and one architecture cannot prove the other.
  native:
    name: Native ${{ matrix.sidecar }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sidecar: [cedar]
        include:
          - arch: amd64
            runner: ubuntu-latest
            # The CPU floor Floci's own image uses; GraalVM's default would be x86-64-v3.
            march: -Dquarkus.native.additional-build-args-append=-march=x86-64-v2
          - arch: arm64
            runner: ubuntu-24.04-arm
            march: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven

      - name: Build the native executable and run the integration tests against it
        run: ./mvnw -B -pl ${{ matrix.sidecar }} -am verify -Dnative ${{ matrix.march }}

      - name: Stage the executable and its native library
        run: |
          mkdir -p native/${{ matrix.arch }}
          cp ${{ matrix.sidecar }}/target/sidecar-runner native/${{ matrix.arch }}/application
          find ${{ matrix.sidecar }}/target/cedar-native -name '*.so' -exec cp {} native/${{ matrix.arch }}/ \; 2>/dev/null || true
          ls -la native/${{ matrix.arch }}

      - name: Package the image
        run: docker build -f ${{ matrix.sidecar }}/Dockerfile.package --build-arg SIDECAR_VERSION=0.0.0-ci -t floci-sidecar-${{ matrix.sidecar }}:ci .

      # The contract's observable surface: the labels, a non-root user, and a
      # health response that names the sidecar and the contract major.
      - name: Check the contract
        run: |
          set -euo pipefail
          image="floci-sidecar-${{ matrix.sidecar }}:ci"
          user="$(docker inspect -f '{{.Config.User}}' "$image")"
          [ -n "$user" ] && [ "$user" != "0" ] && [ "$user" != "root" ] \
            || { echo "::error::image runs as root"; exit 1; }
          for label in contract name version port; do
            docker inspect -f "{{index .Config.Labels \"io.floci.sidecar.$label\"}}" "$image" | grep -q . \
              || { echo "::error::missing label io.floci.sidecar.$label"; exit 1; }
          done
          port="$(docker inspect -f '{{index .Config.Labels "io.floci.sidecar.port"}}' "$image")"
          docker run -d --rm --name sidecar -p "18080:$port" "$image"
          for _ in $(seq 1 60); do
            if body="$(curl -fsS http://127.0.0.1:18080/health 2>/dev/null)"; then
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' || { echo "::error::status is not ok"; exit 1; }
              echo "$body" | grep -q "\"name\":\"${{ matrix.sidecar }}\"" || { echo "::error::name mismatch"; exit 1; }
              echo "$body" | grep -q '"contract":"1"' || { echo "::error::contract mismatch"; exit 1; }
              docker rm -f sidecar >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::sidecar did not become healthy"
          docker logs sidecar
          exit 1
